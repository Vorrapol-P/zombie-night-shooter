<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Night — ป้อมริมทุ่ง</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:#e8ecf2;
    font-family:-apple-system,"SF Pro Text","Sukhumvit Set","Helvetica Neue",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  body.playing{cursor:none}
  #stage{position:fixed;inset:0;will-change:transform}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 58%,transparent 45%,rgba(0,0,0,.7) 100%)}
  #dmg{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,transparent 35%,rgba(160,0,0,.85) 100%)}
  #hud{position:fixed;inset:0;pointer-events:none;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(0,0,0,.8);display:none}
  body.playing #hud,body.paused #hud{display:block}
  .lbl{font-size:13px;letter-spacing:.18em;opacity:.75;text-transform:uppercase}
  .lbl b{font-size:15px;letter-spacing:0;opacity:1;margin-left:6px}
  #tl{position:absolute;left:24px;top:18px}
  #tl .big{font-size:34px;font-weight:700;line-height:1}
  #tc{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center}
  #score{font-size:38px;font-weight:800;line-height:1}
  #tr{position:absolute;right:24px;top:20px;text-align:right;line-height:1.7}
  #bl{position:absolute;left:24px;bottom:24px;width:240px}
  #hpbar{height:10px;margin-top:6px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
  #hp{height:100%;width:100%;background:linear-gradient(90deg,#c62828,#ef5350);transition:width .15s}
  #fence{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end}
  #fence .seg{width:78px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.12em;opacity:.65}
  #fence .seg.here{opacity:1}
  #fence .bar{height:7px;margin-top:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;border:1px solid transparent}
  #fence .seg.here .bar{border-color:rgba(255,255,255,.6)}
  #fence .fill{height:100%;background:#c9a36a;transition:width .15s}
  #fence .seg.broken .fill{background:#ef5350}
  #fixing{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);font-size:17px;font-weight:800;color:#ffd08a;letter-spacing:.06em;background:rgba(0,0,0,.45);padding:4px 14px;border-radius:8px}#fixing:empty{display:none}
  #br{position:absolute;right:24px;bottom:22px;text-align:right;pointer-events:auto}
  #ammo{display:flex;gap:4px;justify-content:flex-end}
  #ammo i{width:6px;height:20px;border-radius:3px 3px 1px 1px;background:#e9c46a;box-shadow:0 0 4px rgba(233,196,106,.5)}
  #ammo i.spent{background:rgba(255,255,255,.15);box-shadow:none}
  #reload{margin-top:6px;height:14px;color:#ffcc80}
  #touch{position:fixed;left:0;right:0;bottom:70px;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
  body.touch.playing #touch{display:flex}
  #touch div{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:24px}
  #touch .grp{background:none;border:0;width:auto;gap:10px}
  #banner{position:fixed;left:0;right:0;top:26%;text-align:center;pointer-events:none;
    font-size:56px;font-weight:900;letter-spacing:.12em;opacity:0;text-shadow:0 0 30px rgba(0,0,0,.9)}
  #banner.show{animation:ban 2.2s ease forwards}
  @keyframes ban{0%{opacity:0;transform:scale(1.15)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
  .pop{position:fixed;pointer-events:none;font-weight:900;font-size:18px;color:#fff;white-space:nowrap;
    transform:translate(-50%,-50%);animation:pop .9s ease-out forwards;text-shadow:0 0 8px rgba(0,0,0,.9)}
  .pop.head{color:#ff5252;font-size:22px}
  @keyframes pop{0%{opacity:0;margin-top:0}10%{opacity:1}100%{opacity:0;margin-top:-50px}}
  #xh{position:fixed;left:50%;top:60%;width:48px;height:48px;margin:-24px 0 0 -24px;pointer-events:none;display:none}
  body.playing #xh{display:block}
  #hm{opacity:0}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(5,8,14,.5),rgba(0,0,0,.82))}
  #overlay.hidden{display:none}
  .card{text-align:center;max-width:470px;padding:30px 36px;border-radius:18px;
    background:rgba(12,16,24,.72);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(6px)}
  .card h1{margin:0;font-size:46px;letter-spacing:.14em;font-weight:900;color:#d7e3ff}
  .card h1 span{color:#ef5350}
  .sub{margin:6px 0 18px;opacity:.7;letter-spacing:.08em}
  .card ul{list-style:none;padding:0;margin:0 0 22px;line-height:1.9;font-size:15px;opacity:.9}
  kbd{display:inline-block;min-width:18px;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);font-family:inherit;font-size:13px}
  button{font:inherit;font-size:18px;font-weight:800;letter-spacing:.08em;padding:12px 34px;border-radius:12px;
    border:0;background:#c62828;color:#fff;cursor:pointer;box-shadow:0 6px 24px rgba(198,40,40,.4)}
  button:disabled{background:#3a3f4a;box-shadow:none;cursor:wait}
  #ovStats{font-size:18px;margin:0 0 18px;line-height:1.7}
  #ovMsg{margin:14px 0 0;font-size:13px;opacity:.6}
  body.photo #hud,body.photo #overlay,body.photo #vignette,body.photo #xh{display:none!important}
</style>

<div id="stage"><canvas id="c"></canvas></div>

<svg id="xh" viewBox="-24 -24 48 48">
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9">
    <line x1="0" y1="-18" x2="0" y2="-8"/><line x1="0" y1="8" x2="0" y2="18"/>

  </g>

<div id="overlay">
  <div class="card">
    <h1>ZOMBIE <span>NIGHT</span></h1>
    <div class="sub" id="ovSub">ป้อมริมทุ่ง · ตีสาม · หมอกลง</div>
    <div id="ovStats"></div>
    <ul id="ovHelp">
      <li>🖱️ เล็งด้วยเมาส์ · <kbd>คลิก</kbd> ยิง · 🎯 ยิงหัวตายนัดเดียว</li>
      <li><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> ขยับซ้าย-ขวาในป้อม</li>
      <li>กด <kbd>E</kbd> ค้างไว้ = ซ่อมรั้วช่องที่ยืนอยู่</li>
      <li><kbd>R</kbd> / คลิกขวา รีโหลด · <kbd>P</kbd> พัก</li>
    </ul>
    <button id="startBtn" disabled>กำลังโหลด…</button>
    <div id="ovMsg">ฉากจากรูปจริง → depth 3D · three.js + Quaternius CC0</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ───────── config ─────────
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug'), PHOTO = Q.has('photo');     // ?photo = scene only, for comparing with the original
const META = await (await fetch('assets/scene/meta.json')).json();
const { HOR, TV, TH, CAM_H, WALL_Z, STRUCT_Z, GW, GH } = META;
const MAG = 12, RELOAD_TIME = 1.35;
const FENCE_Z = -3.4, FENCE_W = 11, SEGS = 3, MOVE_X = 3.0, MOVE_SPEED = 4.2, REPAIR_RATE = 28;
const SPAWN_Z = [-47, -38], SPAWN_X = 26;

const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const _v = new THREE.Vector3();
if (PHOTO) document.body.classList.add('photo');
if (matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');

// ───────── renderer / camera ─────────
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.autoClear = false;

const bgScene = new THREE.Scene();     // the photo, rebuilt in 3D (lit only by the flashlight / muzzle)
const scene = new THREE.Scene();       // zombies, fence, fx
scene.fog = new THREE.Fog(0x5a5f6a, 8, 56);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 3000);
camera.position.set(0, CAM_H, 0);
const vmScene = new THREE.Scene();
const vmCam = new THREE.PerspectiveCamera();
vmScene.add(vmCam);
const gunRig = new THREE.Group();
vmCam.add(gunRig);

function layout() {
  const W = innerWidth, H = innerHeight, A = W / H;
  renderer.setSize(W, H, false);
  // same pinhole as the phone that took the photo (26mm eq.), cropped "cover"-style to the window,
  // lens-shifted so the camera stays level: at x=0 the 3D scene lines up with the photo pixel-for-pixel
  let hw, hh;
  if (A >= META.ASPECT) { hw = TH; hh = TH / A; } else { hh = TV; hw = TV * A; }
  const top = (HOR) * 2 * TV, bot = (HOR - 1) * 2 * TV;          // photo extent in tan units
  const yc = clamp((HOR - 0.55) * 2 * TV, bot + hh, top - hh);    // bias the crop a little toward the field
  const n = camera.near;
  camera.projectionMatrix.makePerspective(-hw * n, hw * n, (yc + hh) * n, (yc - hh) * n, n, camera.far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  vmCam.projectionMatrix.copy(camera.projectionMatrix); vmCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
  const e = camera.projectionMatrix.elements, d = 0.8;
  gunRig.position.set(0.5 * d / e[0], (-0.62 + e[9]) * d / e[5], -d);
}
addEventListener('resize', layout);

// ───────── the photo as a 3D set ─────────
// photo pixel (u,v) at forward distance z → world point, seen from the photo's camera at (0, CAM_H, 0)
const photoPoint = (u, v, z) => [(2 * u - 1) * TH * z, CAM_H + (HOR - v) * 2 * TV * z, -z];
const texLoader = new THREE.TextureLoader();
const loadTex = (f, wrap) => new Promise((res, rej) => texLoader.load('assets/scene/' + f, (t) => {
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (wrap) t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
  res(t);
}, undefined, rej));

function gridGeometry(nu, nv, fn) {   // fn(i,j) → {p:[x,y,z], uv:[u,v], ok}
  const pos = new Float32Array(nu * nv * 3), uv = new Float32Array(nu * nv * 2), ok = new Uint8Array(nu * nv), idx = [];
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const k = j * nu + i, r = fn(i, j);
    pos.set(r.p, k * 3); uv.set(r.uv, k * 2); ok[k] = r.ok !== false ? 1 : 0;
  }
  for (let j = 0; j < nv - 1; j++) for (let i = 0; i < nu - 1; i++) {
    const a = j * nu + i, b = a + 1, c = a + nu, d = c + 1;
    if (ok[a] && ok[b] && ok[c] && ok[d]) idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
// photo layers keep their exact colours via emissiveMap; diffuse map lets the flashlight add light on top
const photoMat = (map, extra = {}) => new THREE.MeshLambertMaterial({
  map, emissiveMap: map, emissive: 0xffffff, color: 0x5a5a5a, toneMapped: false, fog: false, ...extra });

let sky, groundTex;
async function buildSet() {
  const [skyT, gT, gA, sT, oT, od] = await Promise.all([
    loadTex('sky.jpg', true), loadTex('ground.jpg', true), loadTex('ground_a.png', true),
    loadTex('struct.png'), loadTex('obj.png'),
    fetch('assets/scene/objdepth.bin').then((r) => r.arrayBuffer()).then((b) => new Float32Array(b)),
  ]);
  gA.colorSpace = THREE.NoColorSpace; groundTex = gT;

  // 1) sky plate at "infinity" (follows the camera so it never parallaxes)
  const D = 2000;
  sky = new THREE.Mesh(gridGeometry(2, 2, (i, j) => {
    const u = -0.25 + i * 1.5, v = -0.15 + j * 1.3;
    return { p: photoPoint(u, v, D), uv: [u, 1 - v] };
  }), new THREE.MeshBasicMaterial({ map: skyT, toneMapped: false, fog: false, depthWrite: false }));
  sky.renderOrder = 0; bgScene.add(sky);

  // 2) ground plane (analytic, y=0) that turns into a vertical treeline wall at WALL_Z
  const vWall = HOR + CAM_H / (2 * TV * WALL_Z);
  const NU = 220, NV = 240, U0 = -1.6, U1 = 2.6, V0 = 0.42, V1 = 1.4;   // wide so sliding never reveals the edge
  const ground = new THREE.Mesh(gridGeometry(NU, NV, (i, j) => {
    const u = U0 + (U1 - U0) * i / (NU - 1), v = V0 + (V1 - V0) * j / (NV - 1);
    const z = v <= vWall ? WALL_Z : CAM_H / ((v - HOR) * 2 * TV);
    return { p: photoPoint(u, v, z), uv: [u, 1 - v] };
  }), photoMat(gT, { alphaMap: gA, transparent: true, alphaTest: 0.02 }));
  ground.renderOrder = 1; bgScene.add(ground);

  // 3) pylon + power lines (thin structures cut from the sky) on a plane at the pylon's distance
  const struct = new THREE.Mesh(gridGeometry(2, 2, (i, j) => {
    const u = i, v = j * (HOR + 0.02);
    return { p: photoPoint(u, v, STRUCT_Z), uv: [u, 1 - v] };
  }), photoMat(sT, { transparent: true, depthWrite: false }));
  struct.renderOrder = 2; bgScene.add(struct);

  // 4) banana plants / bush / spiky plant: upright cut-outs standing where their base meets the ground
  const objs = new THREE.Mesh(gridGeometry(GW, GH, (i, j) => {
    const u = i / (GW - 1), v = j / (GH - 1), z = od[j * GW + i];
    return { p: photoPoint(u, v, z || 10), uv: [u, 1 - v], ok: z > 0 };
  }), photoMat(oT, { transparent: true, alphaTest: 0.35 }));
  objs.renderOrder = 3; bgScene.add(objs);
  return { ground, struct, objs };
}

function sampleFogColor() {   // fog = colour of the mist band in the photo, so zombies dissolve into it
  const img = groundTex.image, c = document.createElement('canvas');
  const w = (c.width = 256), h = (c.height = 192);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(Math.round(w * 0.45), Math.round(h * (HOR + 0.008)), Math.round(w * 0.35), Math.max(2, Math.round(h * 0.02))).data;
  let r = 0, gg = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++; }
  scene.fog.color.setRGB(r / n / 255, gg / n / 255, b / n / 255, THREE.SRGBColorSpace);
  mistMat.forEach((m) => m.color.copy(scene.fog.color));
}

// ───────── lights ─────────
scene.add(new THREE.HemisphereLight(0x8ea4d6, 0x18200f, 0.9));
const moon = new THREE.DirectionalLight(0xc9d6ff, 2.0);
moon.position.set(-45, 30, -35);
scene.add(moon);
const FLASH_I = 30;
function makeFlash(target) {
  const l = new THREE.SpotLight(0xfff0d2, FLASH_I, 75, THREE.MathUtils.degToRad(11), 0.55, 1.5);
  l.target = target; return l;
}
const flashTarget = new THREE.Object3D(), flashTargetBg = new THREE.Object3D();
const flashlight = makeFlash(flashTarget), flashlightBg = makeFlash(flashTargetBg);
flashlight.decay = 1.0;   // gentler falloff: close zombies don't blow out white
scene.add(flashTarget, flashlight); bgScene.add(flashTargetBg, flashlightBg);
const sceneMuzzleLight = new THREE.PointLight(0xffa850, 0, 30, 1.5), bgMuzzleLight = new THREE.PointLight(0xffa850, 0, 30, 1.5);
scene.add(sceneMuzzleLight); bgScene.add(bgMuzzleLight);
vmScene.add(new THREE.HemisphereLight(0xa8b8e0, 0x2a2a22, 2.2));
const vmMoon = new THREE.DirectionalLight(0xc9d6ff, 1.2); vmMoon.position.set(-45, 30, -35); vmScene.add(vmMoon);
const gunFill = new THREE.PointLight(0xc8d4ff, 1.6, 2.5, 1.5);
gunFill.position.set(-0.2, 0.25, 0.1);
vmCam.add(gunFill);

// ───────── textures ─────────
function radialTex(stops, size = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function flashTexture() {
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.translate(s / 2, s / 2);
  for (let i = 0; i < 7; i++) {
    g.rotate((Math.PI * 2) / 7 + Math.random() * 0.3);
    const gr = g.createLinearGradient(0, 0, s / 2, 0);
    gr.addColorStop(0, 'rgba(255,240,200,1)'); gr.addColorStop(1, 'rgba(255,150,40,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, -5); g.lineTo(s / 2, 0); g.lineTo(0, 5); g.fill();
  }
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, s / 3);
  gr.addColorStop(0, 'rgba(255,255,230,1)'); gr.addColorStop(1, 'rgba(255,170,60,0)');
  g.fillStyle = gr; g.fillRect(-s / 2, -s / 2, s, s);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const softTex = radialTex([[0, 'rgba(255,255,255,.9)'], [0.45, 'rgba(255,255,255,.35)'], [1, 'rgba(255,255,255,0)']]);
const blobTex = radialTex([[0, 'rgba(0,0,0,.75)'], [0.6, 'rgba(0,0,0,.35)'], [1, 'rgba(0,0,0,0)']]);
const bloodTex = radialTex([[0, 'rgba(150,10,10,1)'], [0.55, 'rgba(110,0,0,.85)'], [1, 'rgba(70,0,0,0)']], 64);

// ───────── ground mist ─────────
const mist = [], mistMat = [];
for (let i = 0; i < 40; i++) {
  const m = new THREE.SpriteMaterial({ map: softTex, transparent: true, depthWrite: false, opacity: rand(0.1, 0.24) });
  mistMat.push(m);
  const s = new THREE.Sprite(m);
  s.position.set(rand(-50, 50), rand(0.2, 0.9), rand(-48, -12));
  s.scale.set(rand(10, 22), rand(1.6, 3.2), 1);
  s.userData.v = rand(0.15, 0.5) * (Math.random() < 0.5 ? -1 : 1);
  s.visible = !PHOTO;
  scene.add(s); mist.push(s);
}

// ───────── the post: posts driven into the ground, plank fence in 3 sections, barbed wire ─────────
const fenceGroup = new THREE.Group(); fenceGroup.visible = !PHOTO; scene.add(fenceGroup);
const mWood = new THREE.MeshStandardMaterial({ color: 0x8a6c4c, roughness: 0.9, emissive: 0x2a1f14 });
const mWoodDk = new THREE.MeshStandardMaterial({ color: 0x5e4734, roughness: 0.92, emissive: 0x1c140c });
const mWire = new THREE.LineBasicMaterial({ color: 0x8a8f96 });
const mBag = new THREE.MeshStandardMaterial({ color: 0x6b6450, roughness: 1 });
const segW = FENCE_W / SEGS;
const fence = [];

    model.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(model);

      const b = zombies[j]; if (b.state === 'dead') continue;
      const pa = a.root.position, pb = b.root.position;
      const dx = pb.x - pa.x, dz = pb.z - pa.z, d2 = dx * dx + dz * dz;
      if (d2 < 0.64 && d2 > 1e-6) {
        const d = Math.sqrt(d2), k = (0.8 - d) / 2 / d;
        pa.x -= dx * k; pa.z -= dz * k; pb.x += dx * k; pb.z += dz * k;
      }
    }
  }
}

// ───────── game state ─────────
let state = 'loading', wave = 0, toSpawn = 0, spawnT = 0, clearing = false, nextWaveT = 0;
let hp = 100, ammo = MAG, reloading = 0, lastShot = 0, recoil = 0, flashT = 0, dmgFlash = 0, shakeAmt = 0;
let score = 0, kills = 0, shots = 0, hits = 0, best = +localStorage.getItem('zn_best') || 0;
let moveDir = 0, targetX = 0, velX = 0, repairing = false, repairSnd = 0;
const keys = new Set(), touchHold = { L: false, R: false, F: false };

const aimNDC = new THREE.Vector2(0, -0.2), aimPx = { x: innerWidth / 2, y: innerHeight * 0.62 };
const ray = new THREE.Raycaster();
const aimWorld = new THREE.Vector3(), aimQuat = new THREE.Quaternion();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function setAim(x, y) {
  aimPx.x = x; aimPx.y = y;
  aimNDC.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  $('xh').style.left = x + 'px'; $('xh').style.top = y + 'px';
}
function buildFenceHud() {
  const el = $('fence'); el.innerHTML = '';
  ['LEFT', 'MID', 'RIGHT'].forEach((n) => { const d = document.createElement('div'); d.className = 'seg'; d.innerHTML = `${n}<div class="bar"><div class="fill"></div></div>`; el.appendChild(d); });
}
function updateHud() {
  $('wave').textContent = wave; $('score').textContent = score; $('kills').textContent = kills; $('best').textContent = best;
  $('hp').style.width = hp + '%'; $('hpTxt').textContent = Math.ceil(hp);
  $('reload').textContent = reloading > 0 ? 'Reloading…' : ammo === 0 ? 'กด R รีโหลด' : '';
}
function updateFenceHud() {
  const here = segAt(camera.position.x);
  [...$('fence').children].forEach((d, s) => {
    d.classList.toggle('here', s === here); d.classList.toggle('broken', fence[s].hp <= 0);
    d.querySelector('.fill').style.width = fence[s].hp + '%';
  });
  const f = fence[here];
  $('fixing').textContent = repairing ? (f.hp < 100 ? '🔧 กำลังซ่อมรั้ว…' : 'รั้วช่องนี้เต็มแล้ว') : f.hp <= 0 ? '⚠️ รั้วพัง! กด E ค้างเพื่อซ่อม' : '';
}
function buildAmmo() { const el = $('ammo'); el.innerHTML = ''; for (let i = 0; i < MAG; i++) el.appendChild(document.createElement('i')); }
function updateAmmo() { [...$('ammo').children].forEach((b, i) => b.classList.toggle('spent', i >= ammo)); }
function banner(text) { const b = $('banner'); b.textContent = text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function popText(text, cls) {
  const d = document.createElement('div'); d.className = 'pop ' + (cls || ''); d.textContent = text;
  d.style.left = aimPx.x + 'px'; d.style.top = aimPx.y - 30 + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 950);
}
let hmT = 0;
function hitMarker(kill) { const hm = $('hm'); hm.style.opacity = 1; hm.setAttribute('stroke', kill ? '#ff4040' : '#fff'); hmT = kill ? 0.22 : 0.12; }

function shoot() {
  const t = performance.now() / 1000;
  if (reloading > 0 || repairing) return;
  if (ammo <= 0) { sfxDry(); startReload(); return; }
  if (t - lastShot < 0.1) return;
  lastShot = t; ammo--; shots++;
  recoil = 1; flashT = 0.05; shakeAmt = Math.max(shakeAmt, 4);
  sfxShot();
  ray.setFromCamera(aimNDC, camera);
  const res = ray.intersectObjects(hitTargets, false);
  const muzzle = vmToWorld(muzzleFlash, new THREE.Vector3());
  let end;
  if (res.length) {
    const h = res[0]; end = h.point;
    const r = h.object.userData.zombie.hit(h.object.userData.part, h.point, ray.ray.direction);
    hits++;
    if (r === 'headshot' || r === 'kill') {
      kills++; const pts = r === 'headshot' ? 150 : 100; score += pts;
      popText(r === 'headshot' ? `HEADSHOT +${pts}` : `+${pts}`, r === 'headshot' ? 'head' : '');
      hitMarker(true);
    } else { score += 10; hitMarker(false); }
  } else {
    end = ray.ray.intersectPlane(groundPlane, new THREE.Vector3());
    if (!end || end.distanceTo(camera.position) > 80) end = ray.ray.at(80, new THREE.Vector3());
  }
  const pos = tracer.geometry.attributes.position;
  pos.setXYZ(0, muzzle.x, muzzle.y, muzzle.z); pos.setXYZ(1, end.x, end.y, end.z); pos.needsUpdate = true;
  tracer.material.opacity = 0.9;
  updateAmmo(); updateHud();
  if (ammo === 0) setTimeout(startReload, 220);
}
function startReload() {
  if (state !== 'play' || reloading > 0 || ammo === MAG) return;
  reloading = RELOAD_TIME; sfxReload(); updateHud();
}
function hurtPlayer(d) {
  if (state !== 'play') return;
  hp = Math.max(0, hp - d); dmgFlash = 1; shakeAmt = Math.max(shakeAmt, 14); sfxHurt(); updateHud();
  if (hp <= 0) gameOver();
}
function damageFence(s, d, relX) {
  if (state !== 'play' && state !== 'menu') return;
  const f = fence[s]; if (f.hp <= 0) return;
  f.hp = Math.max(0, f.hp - d); sfxWood(relX / 6, 0.45);
  if (f.hp <= 0) { banner('FENCE DOWN'); shakeAmt = Math.max(shakeAmt, 6); sfxWood(relX / 6, 0.9); }
  updateFenceVisual(s);
}

function startWave() {
  wave++; toSpawn = 4 + wave * 3; spawnT = 0.6; clearing = false;
  banner(`WAVE ${wave}`); updateHud();
}
function updateWaves(dt) {
  const living = zombies.reduce((n, z) => n + (z.state !== 'dead'), 0);
  if (toSpawn > 0) {
    spawnT -= dt;
    if (spawnT <= 0 && living < 22) { spawnZombie(); toSpawn--; spawnT = Math.max(0.45, 2.3 - wave * 0.2) * rand(0.6, 1.4); }
  } else if (living === 0) {
    if (!clearing) {
      clearing = true; nextWaveT = 4; score += wave * 50; banner(`CLEAR +${wave * 50}`);
      fence.forEach((f, s) => { f.hp = Math.min(100, f.hp + 25); updateFenceVisual(s); });   // free patch-up between waves
      updateHud();
    }
    nextWaveT -= dt;
    if (nextWaveT <= 0) startWave();
  }
}

function clearZombies() { while (zombies.length) zombies[0].dispose(); }
function startGame() {
  clearZombies();
  hp = 100; ammo = MAG; reloading = 0; wave = 0; score = 0; kills = 0; shots = 0; hits = 0; toSpawn = 0; clearing = false;
  targetX = 0; camera.position.x = 0;
  fence.forEach((f, s) => { f.hp = 100; updateFenceVisual(s); });
  state = 'play'; document.body.classList.add('playing'); document.body.classList.remove('paused'); $('overlay').classList.add('hidden');
  updateAmmo(); startWave();
}
function gameOver() {
  state = 'over'; document.body.classList.remove('playing');
  if (score > best) { best = score; localStorage.setItem('zn_best', best); }
  const acc = shots ? Math.round((hits / shots) * 100) : 0;
  $('ovSub').textContent = 'ป้อมแตก โดนกินแล้ว 🧟';
  $('ovStats').innerHTML = `Wave <b>${wave}</b> · Score <b>${score}</b> · Kills <b>${kills}</b><br>Accuracy <b>${acc}%</b> · Best <b>${best}</b>`;
  $('ovHelp').style.display = 'none';
  $('startBtn').textContent = 'เล่นอีกครั้ง';
  $('overlay').classList.remove('hidden');
}
function setPaused(p) {
  if (p && state === 'play') {
    state = 'paused'; document.body.classList.remove('playing'); document.body.classList.add('paused');
    $('ovSub').textContent = 'พักเกม'; $('ovStats').innerHTML = ''; $('ovHelp').style.display = '';
    $('startBtn').textContent = 'เล่นต่อ'; $('overlay').classList.remove('hidden');
  } else if (!p && state === 'paused') {
    state = 'play'; document.body.classList.add('playing'); document.body.classList.remove('paused'); $('overlay').classList.add('hidden'); clock.getDelta();
  }
}

// ───────── input ─────────
addEventListener('pointermove', (e) => { if (!e.target.closest('#touch')) setAim(e.clientX, e.clientY); });
addEventListener('pointerdown', (e) => {
  if (state !== 'play' || e.target.closest('#overlay') || e.target.closest('#touch')) return;
  if (e.target.closest('#br')) { startReload(); return; }
  setAim(e.clientX, e.clientY);
  if (e.button === 2) startReload(); else if (e.button === 0) { initAudio(); shoot(); }
});
addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (e.code === 'KeyR') startReload();
  if (e.code === 'KeyP' || e.code === 'Escape') setPaused(state === 'play');
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
for (const [id, k] of [['tL', 'L'], ['tR', 'R'], ['tFix', 'F']]) {
  const el = $(id);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); touchHold[k] = true; initAudio(); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(ev, () => (touchHold[k] = false));
}
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
$('startBtn').addEventListener('click', (e) => {
  e.stopPropagation(); initAudio();
  if (state === 'paused') setPaused(false); else startGame();
});

// ───────── main loop ─────────
const clock = new THREE.Clock();
function updatePlayer(dt, t) {
  const L = keys.has('KeyA') || keys.has('ArrowLeft') || touchHold.L, R = keys.has('KeyD') || keys.has('ArrowRight') || touchHold.R;
  moveDir = state === 'play' ? (R ? 1 : 0) - (L ? 1 : 0) : 0;
  repairing = state === 'play' && (keys.has('KeyE') || keys.has('KeyF') || touchHold.F) && reloading <= 0;
  if (repairing) moveDir = 0;
  targetX = clamp(targetX + moveDir * MOVE_SPEED * dt, -MOVE_X, MOVE_X);
  const prev = camera.position.x;
  camera.position.x += (targetX - camera.position.x) * (1 - Math.exp(-dt * 10));
  velX = (camera.position.x - prev) / Math.max(dt, 1e-4);
  camera.position.y = CAM_H + (Math.abs(velX) > 0.3 ? Math.abs(Math.sin(t * 9)) * 0.025 : 0);
  camera.rotation.z = -velX * 0.012;
  if (repairing) {
    const s = segAt(camera.position.x), f = fence[s];
    if (f.hp < 100) {
      f.hp = Math.min(100, f.hp + REPAIR_RATE * dt); updateFenceVisual(s);
      repairSnd -= dt; if (repairSnd <= 0) { repairSnd = 0.32; sfxWood(0, 0.3); }
    }
  }
}
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (state !== 'paused' && state !== 'loading') {
    if (state === 'play') {
      updateWaves(dt);
      if (reloading > 0) { reloading -= dt; if (reloading <= 0) { reloading = 0; ammo = MAG; updateAmmo(); updateHud(); } }
    }
    updatePlayer(dt, t);
    for (let i = zombies.length - 1; i >= 0; i--) zombies[i].update(dt);
    separate();
    updateBlood(dt);
    for (const s of mist) { s.position.x += s.userData.v * dt; if (Math.abs(s.position.x) > 52) s.position.x = -Math.sign(s.position.x) * 50; }
    if (state === 'play') updateFenceHud();
  }
  camera.updateMatrixWorld();
  vmCam.position.copy(camera.position); vmCam.quaternion.copy(camera.quaternion); vmCam.updateMatrixWorld();
  if (sky) sky.position.x = camera.position.x;
  // aim, flashlight, gun pose
  ray.setFromCamera(aimNDC, camera);
  const g = ray.ray.intersectPlane(groundPlane, _v);
  aimWorld.copy(g && g.distanceTo(camera.position) < 70 ? g : ray.ray.at(45, _v));
  flashTarget.position.lerp(aimWorld, 1 - Math.exp(-dt * 20)); flashTargetBg.position.copy(flashTarget.position);
  const fi = PHOTO ? 0 : FLASH_I * (0.96 + Math.sin(t * 37) * 0.02 + Math.sin(t * 13) * 0.02);
  flashlight.intensity = fi * 0.35; flashlightBg.intensity = fi * 0.8;
  gun.position.set(0, Math.sin(t * 1.7) * 0.004, 0);
  // the gun is in view space: aim at the view-space position of the world aim point
  const aimView = camera.worldToLocal(aimWorld.clone()); vmCam.localToWorld(aimView);
  gun.lookAt(aimView);
  aimQuat.slerp(gun.quaternion, 1 - Math.exp(-dt * 18));
  gun.quaternion.copy(aimQuat);
  recoil = Math.max(0, recoil - dt * 7);
  const kick = recoil * recoil;
  gun.rotateX(-kick * 0.45);
  if (reloading > 0) { const k = Math.sin(((RELOAD_TIME - reloading) / RELOAD_TIME) * Math.PI); gun.rotateX(k * 0.8); gun.rotateZ(-k * 0.6); }
  if (repairing) gun.rotateX(0.9);
  gun.translateZ(-kick * 0.07);
  // fx
  flashT -= dt;
  muzzleFlash.visible = flashT > 0;
  if (muzzleFlash.visible) { muzzleFlash.material.rotation = Math.random() * 6; muzzleFlash.scale.setScalar(rand(0.22, 0.32)); }
  muzzleLight.intensity = flashT > 0 ? 6 : 0;
  vmToWorld(flashAnchor, flashlight.position); flashlightBg.position.copy(flashlight.position);
  vmToWorld(muzzleFlash, sceneMuzzleLight.position); bgMuzzleLight.position.copy(sceneMuzzleLight.position);
  sceneMuzzleLight.intensity = flashT > 0 ? 60 : 0; bgMuzzleLight.intensity = flashT > 0 ? 40 : 0;
  tracer.material.opacity = Math.max(0, tracer.material.opacity - dt * 14);
  if (hmT > 0) { hmT -= dt; if (hmT <= 0) $('hm').style.opacity = 0; }
  dmgFlash = Math.max(0, dmgFlash - dt * 2.2);
  const lowHp = state === 'play' && hp < 35 ? 0.25 + Math.sin(t * 5) * 0.1 : 0;
  $('dmg').style.opacity = Math.max(dmgFlash * 0.9, lowHp);
  shakeAmt = Math.max(0, shakeAmt - dt * 40);
  stage.style.transform = shakeAmt > 0.1
    ? `translate(${rand(-shakeAmt, shakeAmt).toFixed(1)}px,${rand(-shakeAmt, shakeAmt).toFixed(1)}px) scale(${1 + shakeAmt * 0.003})` : '';
  renderer.clear();
  renderer.render(bgScene, camera);   // photo set first (writes depth: plants hide zombies behind them)
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(vmScene, vmCam);
}

// ───────── boot ─────────
let set;
async function boot() {
  buildAmmo(); buildFenceHud(); $('best').textContent = best;
  layout(); setAim(innerWidth / 2, innerHeight * 0.62);
  set = await buildSet();
  sampleFogColor();
  frame();
  if (PHOTO) { state = 'menu'; window.__ready = true; return; }
  try {
    await loadTypes((p) => ($('startBtn').textContent = `กำลังโหลด… ${Math.round(p * 100)}%`));
  } catch (err) {
    $('ovMsg').textContent = 'โหลดโมเดลไม่ได้: ' + err.message + ' (ต้องเปิดผ่าน http server — ใช้ ./play.sh)';
    throw err;
  }
  state = 'menu';
  for (let i = 0; i < 4; i++) spawnZombie([-40, -22]);
  $('startBtn').disabled = false; $('startBtn').textContent = 'เริ่มเล่น';
  window.__ready = true;
}
boot();

window.game = {
  zombies, spawnZombie, get state() { return state; }, camera, scene, bgScene, shoot, setAim, Zombie, TYPES, fence,
  setX: (x) => { targetX = clamp(x, -MOVE_X, MOVE_X); camera.position.x = targetX; }, keys,
  get hp() { return hp; }, get set() { return set; },
};
</script>
